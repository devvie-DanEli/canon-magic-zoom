name: Build EOS M - Auto ISO
run-name: Build EOS M - Auto ISO

on:
  push:
    branches:
      - feature/eosm-auto-iso
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Python 2 + Python 3 Docutils
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 python3-docutils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version
          python2 --version
          rst2html --version || true

      - name: Generate placeholder module info
        run: |
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
            fi
          done

      - name: Enable EOS M modules for autoload
        run: |
          set -euo pipefail
          grep -q '"photoctl"' src/module.c || \
            sed -i 's/"hdmi_out"};/"hdmi_out", "photoctl"};/' src/module.c
          grep -q '"auto_iso"' src/module.c || \
            sed -i 's/"photoctl"};/"photoctl", "auto_iso"};/' src/module.c
          grep 'core_modules' src/module.c

      - name: Apply EOS M Auto ISO core integration
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('Auto ISO patch: missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)

          replace_once(
              'src/lvinfo.h',
              '    LVINFO_TOUCH_BIT_DEPTH,\n'
              '    LVINFO_TOUCH_MEMORY,\n',
              '    LVINFO_TOUCH_BIT_DEPTH,\n'
              '    LVINFO_TOUCH_AUTO_ISO,\n'
              '    LVINFO_TOUCH_MEMORY,\n',
              'lvinfo Auto ISO enum'
          )

          replace_once(
              'src/lvinfo.c',
              'static int (*dual_iso_is_enabled)() = MODULE_FUNCTION(dual_iso_is_enabled);\n'
              'static int (*dual_iso_get_recovery_iso)() = MODULE_FUNCTION(dual_iso_get_recovery_iso);\n',
              'static int (*dual_iso_is_enabled)() = MODULE_FUNCTION(dual_iso_is_enabled);\n'
              'static int (*dual_iso_get_recovery_iso)() = MODULE_FUNCTION(dual_iso_get_recovery_iso);\n'
              'static int (*eosm_auto_iso_is_enabled)() = MODULE_FUNCTION(eosm_auto_iso_is_enabled);\n'
              'static int (*eosm_auto_iso_is_locked)() = MODULE_FUNCTION(eosm_auto_iso_is_locked);\n',
              'lvinfo Auto ISO module hooks'
          )

          replace_once(
              'src/lvinfo.c',
              '        case LVINFO_TOUCH_BIT_DEPTH:return "Bitdepth info";\n'
              '        case LVINFO_TOUCH_MEMORY:   return "Memory";\n',
              '        case LVINFO_TOUCH_BIT_DEPTH:return "Bitdepth info";\n'
              '        case LVINFO_TOUCH_AUTO_ISO: return "Auto ISO";\n'
              '        case LVINFO_TOUCH_MEMORY:   return "Memory";\n',
              'lvinfo Auto ISO field name'
          )

          replace_once(
              'src/lvinfo.c',
              '        case LVINFO_TOUCH_ISO:\n'
              '#ifdef CONFIG_SLIM_MENUS\n'
              '            /* The editor changes recovery ISO when Dual ISO is enabled, so\n',
              '        case LVINFO_TOUCH_ISO:\n'
              '#ifdef CONFIG_SLIM_MENUS\n'
              '            /* The editor changes recovery ISO when Dual ISO is enabled, so\n',
              '            if (eosm_auto_iso_is_enabled && eosm_auto_iso_is_enabled())\n'
              '                return "AUTO ON";\n'
              '            if (eosm_auto_iso_is_locked && eosm_auto_iso_is_locked())\n'
              '                return "AUTO OFF";\n',
              'lvinfo Auto ISO insertion point'
          )

          replace_once(
              'src/lvinfo.c',
              '            return lens_info.raw_iso ? lens_format_iso(lens_info.raw_iso) : "ISO Auto";\n'
              '        case LVINFO_TOUCH_WB:\n',
              '            return lens_info.raw_iso ? lens_format_iso(lens_info.raw_iso) : "ISO Auto";\n'
              '        case LVINFO_TOUCH_AUTO_ISO:\n'
              '            if (eosm_auto_iso_is_locked && eosm_auto_iso_is_locked())\n'
              '                return "AUTO OFF";\n'
              '            return (eosm_auto_iso_is_enabled && eosm_auto_iso_is_enabled())\n'
              '                ? "AUTO ON" : "AUTO OFF";\n'
              '        case LVINFO_TOUCH_WB:\n',
              'lvinfo Auto ISO field value'
          )

          replace_once(
              'src/lvinfo.c',
              '            else if (!strcmp(name, "ISO")) candidate = LVINFO_TOUCH_ISO;\n'
              '            else if (!strcmp(name, "White Balance")) candidate = LVINFO_TOUCH_WB;\n',
              '            else if (!strcmp(name, "ISO")) candidate = LVINFO_TOUCH_ISO;\n'
              '            else if (!strcmp(name, "Auto ISO") && is_movie_mode() &&\n'
              '                     (!eosm_auto_iso_is_locked || !eosm_auto_iso_is_locked()))\n'
              '                candidate = LVINFO_TOUCH_AUTO_ISO;\n'
              '            else if (!strcmp(name, "White Balance")) candidate = LVINFO_TOUCH_WB;\n',
              'lvinfo Auto ISO hit test'
          )

          replace_once(
              'src/gui-common.c',
              'static int (*dual_iso_is_enabled)() = MODULE_FUNCTION(dual_iso_is_enabled);\n'
              'static int (*dual_iso_slim_step_recovery)(int) =\n'
              '    MODULE_FUNCTION(dual_iso_slim_step_recovery);\n',
              'static int (*dual_iso_is_enabled)() = MODULE_FUNCTION(dual_iso_is_enabled);\n'
              'static int (*dual_iso_slim_step_recovery)(int) =\n'
              '    MODULE_FUNCTION(dual_iso_slim_step_recovery);\n'
              'static int (*eosm_auto_iso_set_from_touch)(int) =\n'
              '    MODULE_FUNCTION(eosm_auto_iso_set_from_touch);\n'
              'static int (*eosm_auto_iso_prepare_manual_iso)(void) =\n'
              '    MODULE_FUNCTION(eosm_auto_iso_prepare_manual_iso);\n',
              'gui-common Auto ISO module hooks'
          )

          replace_once(
              'src/gui-common.c',
              '        case LVINFO_TOUCH_ISO:\n'
              '            /* With Dual ISO, base ISO remains fixed and this editor steps\n'
              '             * only the recovery ISO.  Otherwise retain the normal ISO path. */\n'
              '            if (slim_touch_dual_iso_enabled())\n'
              '                slim_touch_step_dual_iso_recovery(sign);\n'
              '            else if (!menu_adjust_value_by_name("Expo", "ISO", sign))\n'
              '                iso_toggle((void *)-1, sign);\n'
              '            break;\n',
              '        case LVINFO_TOUCH_ISO:\n'
              '            /* With Dual ISO, base ISO remains fixed and this editor steps\n'
              '             * only the recovery ISO.  Otherwise retain the normal ISO path. */\n'
              '            if (slim_touch_dual_iso_enabled())\n'
              '                slim_touch_step_dual_iso_recovery(sign);\n'
              '            else\n'
              '            {\n'
              '                if (eosm_auto_iso_prepare_manual_iso)\n'
              '                    eosm_auto_iso_prepare_manual_iso();\n'
              '                if (!menu_adjust_value_by_name("Expo", "ISO", sign))\n'
              '                    iso_toggle((void *)-1, sign);\n'
              '            }\n'
              '            break;\n'
              '        case LVINFO_TOUCH_AUTO_ISO:\n'
              '            if (eosm_auto_iso_set_from_touch)\n'
              '                eosm_auto_iso_set_from_touch(sign);\n'
              '            break;\n',
              'gui-common Auto ISO touch handling'
          )

          replace_once(
              'src/mem_recall.c',
              'static int (*crop_rec_memory_apply)(int, int, int, int, int) =\n'
              '    MODULE_FUNCTION(crop_rec_memory_apply);\n',
              'static int (*crop_rec_memory_apply)(int, int, int, int, int) =\n'
              '    MODULE_FUNCTION(crop_rec_memory_apply);\n'
              'static int (*eosm_auto_iso_is_enabled)(void) =\n'
              '    MODULE_FUNCTION(eosm_auto_iso_is_enabled);\n'
              'static int (*eosm_auto_iso_get_last_manual_iso)(void) =\n'
              '    MODULE_FUNCTION(eosm_auto_iso_get_last_manual_iso);\n'
              'static int (*eosm_auto_iso_prepare_manual_iso)(void) =\n'
              '    MODULE_FUNCTION(eosm_auto_iso_prepare_manual_iso);\n',
              'Memory Recall Auto ISO hooks'
          )

          replace_once(
              'src/mem_recall.c',
              '    *f.iso = lens_info.raw_iso;\n'
              '    *f.shutter = lens_info.raw_shutter;\n',
              '    int saved_iso = lens_info.raw_iso;\n'
              '    /* Memory Recall stores manual ISO only. If Auto ISO is active,\n'
              '     * preserve the last manual ISO instead of storing the Auto sentinel 0. */\n'
              '    if (!saved_iso && eosm_auto_iso_is_enabled &&\n'
              '        eosm_auto_iso_is_enabled() && eosm_auto_iso_get_last_manual_iso)\n'
              '        saved_iso = eosm_auto_iso_get_last_manual_iso();\n'
              '    if (!saved_iso)\n'
              '    {\n'
              '        NotifyBox(1500, "Manual ISO unavailable");\n'
              '        return 0;\n'
              '    }\n'
              '    *f.iso = saved_iso;\n'
              '    *f.shutter = lens_info.raw_shutter;\n',
              'Memory Recall manual ISO save'
          )

          replace_once(
              'src/mem_recall.c',
              '    if (*f.iso)\n'
              '        lens_set_rawiso(*f.iso);\n',
              '    /* Loading a memory restores manual exposure. Turn off the\n'
              '     * standalone Auto ISO feature before applying the stored ISO. */\n'
              '    if (eosm_auto_iso_prepare_manual_iso)\n'
              '        eosm_auto_iso_prepare_manual_iso();\n'
              '    if (*f.iso)\n'
              '        lens_set_rawiso(*f.iso);\n',
              'Memory Recall manual ISO load'
          )

          print('EOS M Auto ISO core integration applied')
          PY

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-5_4-2016q3
          key: arm-toolchain-5_4-2016q3

      - name: Download ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget -q https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q3-update/+download/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-5_4-2016q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs
        run: |
          set -euo pipefail
          ls -lh platform/EOSM.202/autoexec.bin
          ls -lh platform/EOSM.202/magiclantern-*.zip
          zipfile=$(ls platform/EOSM.202/magiclantern-*.zip)
          for mod in auto_iso.mo crop_rec.mo dual_iso.mo hdmi_out.mo mlv_lite.mo mlv_play.mo mlv_snd.mo sd_uhs.mo file_man.mo bench.mo photoctl.mo; do
            if ! unzip -l "$zipfile" | grep -q "$mod"; then
              echo "Missing from zip: $mod"
              unzip -l "$zipfile" | grep '\\.mo$' || true
              exit 1
            fi
            echo "OK: $mod"
          done

      - name: Upload autoexec.bin
        uses: actions/upload-artifact@v4
        with:
          name: autoexec-auto-iso.bin
          path: platform/EOSM.202/autoexec.bin
          if-no-files-found: error

      - name: Upload full Magic Lantern zip
        uses: actions/upload-artifact@v4
        with:
          name: magiclantern-eosm-auto-iso-zip
          path: platform/EOSM.202/magiclantern-*.zip
          if-no-files-found: error
