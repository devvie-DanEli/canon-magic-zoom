name: Build EOS M Magic Zoom Touch
run-name: Build EOS M Magic Zoom Touch

on:
  push:
    branches:
      - feature/eosm-magic-zoom-touch
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out known-good EOS M photo-touch base
        uses: actions/checkout@v4
        with:
          ref: feature/eosm-photo-touch-profiles

      - name: Overlay known-good EOS M exposure separation
        run: |
          set -euo pipefail
          git fetch origin feature/eosm-auto-iso
          git show origin/feature/eosm-auto-iso:src/expo_mode_sep.c > src/expo_mode_sep.c
          git show origin/feature/eosm-auto-iso:src/expo_mode_sep.h > src/expo_mode_sep.h
          test -s src/expo_mode_sep.c
          test -s src/expo_mode_sep.h
          echo "Using known-good Photo/Movie exposure separation"

      - name: Overlay known-good photo control module
        run: |
          set -euo pipefail
          if git show origin/feature/eosm-auto-iso:modules/photoctl/photoctl.c > /tmp/photoctl.c 2>/dev/null; then
            if [ "$(wc -c < /tmp/photoctl.c)" -gt 1000 ]; then
              mkdir -p modules/photoctl
              cp /tmp/photoctl.c modules/photoctl/photoctl.c
            fi
          fi

      - name: Install Python 2 + Python 3 Docutils
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 python3-docutils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

      - name: Generate placeholder module info
        run: |
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
            fi
          done

      - name: Restore photo/video separation hooks and photo control autoload
        run: |
          set -euo pipefail
          grep -q '"photoctl"' src/module.c || \
            sed -i 's/"hdmi_out"};/"hdmi_out", "photoctl"};/' src/module.c
          python2 - <<'PY'
          from __future__ import print_function
          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)
              print('OK:', label)
          replace_once('src/shoot.c', '#include "powersave.h"\n',
                       '#include "powersave.h"\n#include "expo_mode_sep.h"\n',
                       'exposure separation header')
          replace_once('src/shoot.c',
                       '#if defined(CONFIG_MODULES)\n        module_exec_cbr(CBR_SHOOT_TASK);\n#endif\n',
                       '        expo_sep_update();\n'
                       '        expo_sep_apply_deferred();\n\n'
                       '#if defined(CONFIG_MODULES)\n'
                       '        module_exec_cbr(CBR_SHOOT_TASK);\n'
                       '#endif\n',
                       'exposure separation shoot-task hook')
          replace_once('src/Makefile.src', '\tpowersave.o \\\n',
                       '\tpowersave.o \\\n\texpo_mode_sep.o \\\n',
                       'exposure separation object')
          PY

      - name: Restore known-good Photo Live View touch routing
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function
          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)
              print('OK:', label)
          replace_once('src/gui-common.c',
              'static int slim_touch_lv_context_ok(void)\n'
              '{\n'
              '    return lv && is_movie_mode() && !RECORDING &&\n'
              '           !gui_menu_shown() && lv_dispsize != 10 &&\n'
              '           !slim_crop_rec_transition_busy();\n'
              '}\n',
              'static int slim_touch_lv_context_ok(void)\n'
              '{\n'
              '    return lv && !RECORDING && !gui_menu_shown() &&\n'
              '           lv_dispsize != 10 && !slim_crop_rec_transition_busy();\n'
              '}\n',
              'shared Photo/Movie LV editor context')
          replace_once('src/gui-common.c',
              '    if (monitoring_graph_touch_toggle(x, y))\n'
              '        return 1;\n\n'
              '    if (mem_recall_panel_is_open())\n'
              '        return mem_recall_panel_touch(x, y);\n',
              '    if (is_movie_mode() && monitoring_graph_touch_toggle(x, y))\n'
              '        return 1;\n\n'
              '    if (is_movie_mode() && mem_recall_panel_is_open())\n'
              '        return mem_recall_panel_touch(x, y);\n',
              'Movie-only auxiliary touch controls')
          replace_once('src/gui-common.c',
              '            slim_touch_lv_control_consumed = slim_touch_lv_direct_editor(event);\n'
              '            if (slim_touch_lv_control_consumed)\n'
              '                return 0;\n'
              '            /* Tap gestures (including Quick Panel) only originate from the\n',
              '            slim_touch_lv_control_consumed = slim_touch_lv_direct_editor(event);\n'
              '            if (slim_touch_lv_control_consumed)\n'
              '                return 0;\n'
              '            if (!is_movie_mode())\n'
              '            {\n'
              '                slim_touch_lv_control_consumed = 1;\n'
              '                slim_touch_lv_pressed = 0;\n'
              '                slim_touch_tap_count = 0;\n'
              '                slim_touch_tap_deadline = 0;\n'
              '                return 0;\n'
              '            }\n'
              '            /* Tap gestures (including Quick Panel) only originate from the\n',
              'Photo-mode no-fallthrough gate')
          replace_once('src/gui-common.c',
              '        if (slim_touch_lv_context_ok())\n'
              '        {\n'
              '            /* Keep the existing simultaneous two-finger Last Settings shortcut. */\n'
              '            gui_open_last_menu_selection();\n'
              '            return 0;\n'
              '        }\n',
              '        if (slim_touch_lv_context_ok() && is_movie_mode())\n'
              '        {\n'
              '            /* Keep the existing simultaneous two-finger Last Settings shortcut. */\n'
              '            gui_open_last_menu_selection();\n'
              '            return 0;\n'
              '        }\n',
              'Movie-only two-finger Last Settings')
          replace_once('src/gui-common.c',
              'static void slim_touch_open_for_taps(int taps)\n'
              '{\n'
              '    if (!slim_touch_lv_context_ok() || lvinfo_touch_editor_is_open())\n'
              '        return;\n',
              'static void slim_touch_open_for_taps(int taps)\n'
              '{\n'
              '    if (!slim_touch_lv_context_ok() || !is_movie_mode() ||\n'
              '        lvinfo_touch_editor_is_open())\n'
              '        return;\n',
              'Movie-only tap/menu open')
          PY

      - name: Implement Magic Zoom touch origin and Quick Panel takeover
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function
          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)
              print('OK:', label)

          # 1) Add a touch-origin state and exported API to Magic Zoom.
          replace_once('src/zebra.c',
              'static int zoom_overlay_dirty = 0;\n',
              'static int zoom_overlay_dirty = 0;\n'
              'static int zoom_overlay_touch_x = 360;\n'
              'static int zoom_overlay_touch_y = 240;\n'
              'static int zoom_overlay_touch_active = 0;\n\n'
              'int zoom_overlay_touch_is_enabled(void)\n'
              '{\n'
              '#ifdef FEATURE_MAGIC_ZOOM\n'
              '    return lv && !RECORDING && zoom_overlay_enabled;\n'
              '#else\n'
              '    return 0;\n'
              '#endif\n'
              '}\n\n'
              'void zoom_overlay_set_touch_position(int x, int y)\n'
              '{\n'
              '#ifdef FEATURE_MAGIC_ZOOM\n'
              '    zoom_overlay_touch_x = COERCE(x, 0, 719);\n'
              '    zoom_overlay_touch_y = COERCE(y, 0, 479);\n'
              '    zoom_overlay_touch_active = 1;\n'
              '    redraw();\n'
              '#else\n'
              '    (void)x; (void)y;\n'
              '#endif\n'
              '}\n',
              'Magic Zoom touch state/API')

          # 2) A touch-origin must force the overlay visible after the tap,
          #    while retaining the normal enabled/trigger logic otherwise.
          replace_once('src/zebra.c',
              '    if (zoom_overlay_trigger_mode == 4) return true;\n',
              '    if (zoom_overlay_touch_active) return true;\n\n'
              '    if (zoom_overlay_trigger_mode == 4) return true;\n',
              'Magic Zoom touch trigger')

          # 3) Replace the fixed Position menu mapping with a touch override.
          old = ('    switch(zoom_overlay_pos)\n'
                 '    {\n'
                 '        case 0: // AFF\n'
                 '            zb_x0_lv = aff_x0_lv;\n'
                 '            zb_y0_lv = aff_y0_lv;\n'
                 '            break;\n'
                 '        case 1: // NW\n'
                 '            zb_x0_lv = W/2 + 50;\n'
                 '            zb_y0_lv = H/2 + 50;\n'
                 '            break;\n'
                 '        case 2: // NE\n'
                 '            zb_x0_lv = BM2LV_X(os.x_max) - W/2 - 50;\n'
                 '            zb_y0_lv = H/2 + 50;\n'
                 '            break;\n'
                 '        case 3: // SE\n'
                 '            zb_x0_lv = BM2LV_X(os.x_max) - W/2 - 50;\n'
                 '            zb_y0_lv = BM2LV_Y(os.y_max) - H/2 - 50;\n'
                 '            break;\n'
                 '        case 4: // SV\n'
                 '            zb_x0_lv = W/2 + 50;\n'
                 '            zb_y0_lv = BM2LV_Y(os.y_max) - H/2 - 50;\n'
                 '            break;\n'
                 '        default:\n'
                 '            return;\n'
                 '    }\n')
          new = ('    if (zoom_overlay_touch_active)\n'
                 '    {\n'
                 '        /* EOS M touch coordinates are 720x480 BMP-space.\n'
                 '         * Convert them to the active LV image dimensions. */\n'
                 '        zb_x0_lv = zoom_overlay_touch_x * lv->width / 720;\n'
                 '        zb_y0_lv = zoom_overlay_touch_y * lv->height / 480;\n'
                 '    }\n'
                 '    else\n'
                 '    {\n'
                 '        switch(zoom_overlay_pos)\n'
                 '        {\n'
                 '            case 0: // AFF\n'
                 '                zb_x0_lv = aff_x0_lv;\n'
                 '                zb_y0_lv = aff_y0_lv;\n'
                 '                break;\n'
                 '            case 1: // NW\n'
                 '                zb_x0_lv = W/2 + 50;\n'
                 '                zb_y0_lv = H/2 + 50;\n'
                 '                break;\n'
                 '            case 2: // NE\n'
                 '                zb_x0_lv = BM2LV_X(os.x_max) - W/2 - 50;\n'
                 '                zb_y0_lv = H/2 + 50;\n'
                 '                break;\n'
                 '            case 3: // SE\n'
                 '                zb_x0_lv = BM2LV_X(os.x_max) - W/2 - 50;\n'
                 '                zb_y0_lv = BM2LV_Y(os.y_max) - H/2 - 50;\n'
                 '                break;\n'
                 '            case 4: // SV\n'
                 '                zb_x0_lv = W/2 + 50;\n'
                 '                zb_y0_lv = BM2LV_Y(os.y_max) - H/2 - 50;\n'
                 '                break;\n'
                 '            default:\n'
                 '                return;\n'
                 '        }\n'
                 '    }\n')
          replace_once('src/zebra.c', old, new, 'Magic Zoom touch-centered source window')
          PY

      - name: Route EOS M Live View image taps to Magic Zoom only when enabled
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function
          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)
              print('OK:', label)

          old = ('            /* Tap gestures (including Quick Panel) only originate from the\n'
                 '             * image area. Unassigned space in either status bar is inert. */\n'
                 '            if (!eosm_touch_get_xy(event, &touch_x, &touch_y) ||\n'
                 '                lvinfo_touch_is_bar_area(touch_y))\n'
                 '            {\n'
                 '                slim_touch_lv_control_consumed = 1;\n'
                 '                slim_touch_lv_pressed = 0;\n'
                 '                return 0;\n'
                 '            }\n'
                 '            slim_touch_lv_pressed = 1;\n')
          new = ('            /* Tap gestures (including Quick Panel) only originate from the\n'
                 '             * image area. Unassigned space in either status bar is inert. */\n'
                 '            if (!eosm_touch_get_xy(event, &touch_x, &touch_y) ||\n'
                 '                lvinfo_touch_is_bar_area(touch_y))\n'
                 '            {\n'
                 '                slim_touch_lv_control_consumed = 1;\n'
                 '                slim_touch_lv_pressed = 0;\n'
                 '                return 0;\n'
                 '            }\n'
                 '            /* When Magic Zoom is enabled, an image-area tap is its own\n'
                 '             * gesture. Do not open the Quick Panel in this case.\n'
                 '             * Status-bar field editors above remain untouched. */\n'
                 '            if (zoom_overlay_touch_is_enabled())\n'
                 '            {\n'
                 '                zoom_overlay_set_touch_position(touch_x, touch_y);\n'
                 '                slim_touch_lv_control_consumed = 1;\n'
                 '                slim_touch_lv_pressed = 1;\n'
                 '                return 0;\n'
                 '            }\n'
                 '            slim_touch_lv_pressed = 1;\n')
          replace_once('src/gui-common.c', old, new, 'Magic Zoom touch takeover')
          PY

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-5_4-2016q3
          key: arm-toolchain-5_4-2016q3

      - name: Download ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget -q https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q3-update/+download/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-5_4-2016q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs and Auto ISO exclusion
        run: |
          set -euo pipefail
          test -f platform/EOSM.202/autoexec.bin
          ls -la platform/EOSM.202/*.bin platform/EOSM.202/*.zip
          unzip -l platform/EOSM.202/*.zip | grep -v 'auto_iso.mo' > /tmp/package.txt
          if unzip -l platform/EOSM.202/*.zip | grep -q 'auto_iso.mo'; then
            echo 'ERROR: Auto ISO module must remain disabled on this baseline'
            exit 1
          fi
          echo 'Auto ISO module absent as expected'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eosm-magic-zoom-touch-build
          path: |
            platform/EOSM.202/autoexec.bin
            platform/EOSM.202/*.zip
            platform/EOSM.202/*.sym
          if-no-files-found: warn
