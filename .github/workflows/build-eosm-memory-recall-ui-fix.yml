name: Build EOS M - Memory Recall UI Fix
run-name: Build EOS M - Memory Recall UI Fix

on:
  push:
    branches:
      - feature/eosm-memory-recall-fix
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the known-good EOS M base
        uses: actions/checkout@v4
        with:
          ref: feature/eosm-photo-touch-profiles

      - name: Overlay current Memory Recall sources
        run: |
          set -euo pipefail
          git fetch origin feature/eosm-memory-recall-fix
          git show origin/feature/eosm-memory-recall-fix:src/mem_recall.c > src/mem_recall.c
          git show origin/feature/eosm-memory-recall-fix:modules/crop_rec/crop_rec.c > modules/crop_rec/crop_rec.c
          git show origin/feature/eosm-memory-recall-fix/modules/Makefile.modules.user > modules/Makefile.modules.user

      - name: Install Python 2 + Python 3 Docutils
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 python3-docutils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python2 --version

      - name: Generate placeholder module info
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
            fi
          done

      - name: Patch Memory Recall navigation dismissal
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          path = 'src/gui-common.c'
          data = open(path, 'r').read()

          old = '''static int handle_slim_lv_editor_keys(struct event *event)\n{\n    if (!lvinfo_touch_editor_is_open())\n        return 1;\n'''

          new = '''static int handle_slim_lv_editor_keys(struct event *event)\n{\n    /* Memory Recall is a modal overlay, but navigation keys must still be\n     * allowed to leave Live View.  Close the panel first, then let Canon\n     * handle PLAY/MENU/half-shutter normally. */\n    if (mem_recall_panel_is_open())\n    {\n        if (event->param == BGMT_PLAY ||\n            event->param == BGMT_MENU ||\n            event->param == BGMT_PRESS_HALFSHUTTER)\n        {\n            mem_recall_panel_close();\n            slim_touch_tap_count = 0;\n            slim_touch_tap_deadline = 0;\n            return 1;\n        }\n    }\n\n    if (!lvinfo_touch_editor_is_open())\n        return 1;\n'''

          if old not in data:
              raise SystemExit('missing gui-common editor handler')
          data = data.replace(old, new, 1)
          open(path, 'w').write(data)
          print('Memory Recall navigation dismissal patch applied')
          PY

      - name: Patch Memory Recall auto-close on LV exit
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          path = 'src/mem_recall.c'
          data = open(path, 'r').read()

          old = '''    if (!mem_panel_open)\n        return;\n\n    bmp_fill(COLOR_BLACK, MEM_BOX_X, MEM_BOX_Y, MEM_BOX_W, MEM_BOX_H);\n'''

          new = '''    if (!mem_panel_open)\n        return;\n\n    /* The modal belongs only to idle Movie Live View.  If Canon has already\n     * transitioned to playback/photo/recording, clear the overlay state so it\n     * cannot survive the mode change or get redrawn over the next GUI. */\n    if (!lv || !is_movie_mode() || RECORDING)\n    {\n        mem_recall_panel_close();\n        return;\n    }\n\n    bmp_fill(COLOR_BLACK, MEM_BOX_X, MEM_BOX_Y, MEM_BOX_W, MEM_BOX_H);\n'''

          if old not in data:
              raise SystemExit('missing Memory Recall draw guard')
          data = data.replace(old, new, 1)
          open(path, 'w').write(data)
          print('Memory Recall auto-close guard applied')
          PY

      - name: Validate navigation fix
        run: |
          set -euo pipefail
          grep -q 'event->param == BGMT_PLAY' src/gui-common.c
          grep -q 'event->param == BGMT_PRESS_HALFSHUTTER' src/gui-common.c
          grep -q '!lv || !is_movie_mode() || RECORDING' src/mem_recall.c
          grep -q 'mem_recall_panel_close();' src/mem_recall.c
          echo 'Memory Recall navigation dismissal validated.'

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-4_8-2014q3
          key: gcc-arm-none-eabi-4_8-2014q3

      - name: Download ARM toolchain
        run: |
          if [ ! -d "$HOME/gcc-arm-none-eabi-4_8-2014q3" ]; then
            wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/4-8-2014q3/gcc-arm-none-eabi-4_8-2014q3-20131204-linux.tar.bz2
            tar -xjf gcc-arm-none-eabi-4_8-2014q3-20131204-linux.tar.bz2 -C "$HOME"
            mv "$HOME/gcc-arm-none-eabi-4_8-2014q3" "$HOME/gcc-arm-none-eabi-4_8-2014q3" 2>/dev/null || true
          fi

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-4_8-2014q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -f platform/EOSM.202/autoexec.bin
          test -f platform/EOSM.202/*.zip
          test -f platform/EOSM.202/modules/crop_rec.mo || true
          test ! -f platform/EOSM.202/modules/auto_iso.mo
          echo 'EOS M Memory Recall UI fix build completed.'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eosm-memory-recall-ui-fix
          path: |
            platform/EOSM.202/autoexec.bin
            platform/EOSM.202/*.zip
          if-no-files-found: error
