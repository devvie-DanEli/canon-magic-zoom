name: Build EOS M Auto ISO RAW Meter
run-name: Build EOS M Auto ISO RAW Meter

on:
  push:
    branches:
      - feature/eosm-auto-iso-raw-meter
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out photo-touch-profiles base (working sources)
        uses: actions/checkout@v4
        with:
          ref: feature/eosm-photo-touch-profiles

      - name: Overlay current EOS M RAW-meter branch sources
        run: |
          set -euo pipefail
          git fetch origin feature/eosm-auto-iso-raw-meter
          for f in modules/photoctl/photoctl.c modules/auto_iso/auto_iso.c modules/auto_iso/Makefile modules/Makefile.modules.user src/expo_mode_sep.c src/expo_mode_sep.h src/histogram.h src/raw_meter.c src/eosm_auto_iso_lv.c; do
            echo "Overlaying $f"
            mkdir -p "$(dirname "$f")"
            git show "origin/feature/eosm-auto-iso-raw-meter:$f" > "$f"
            test -s "$f"
          done

      - name: Install Python 2 + Python 3 Docutils
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 python3-docutils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

      - name: Generate placeholder module info
        run: |
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
            fi
          done

      - name: Enable EOS M Auto ISO core LV item
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          path = 'src/Makefile.src'
          data = open(path, 'r').read()
          anchor = '\thistogram.o \\\n'
          object_line = '\teosm_auto_iso_lv.o \\\n'
          if anchor not in data:
              raise SystemExit('EOS M patch: histogram object anchor missing')
          if object_line not in data:
              data = data.replace(anchor, anchor + object_line, 1)
          open(path, 'w').write(data)
          PY

      - name: Enable Photo control and Auto ISO modules
        run: |
          set -euo pipefail
          grep -q '"photoctl"' src/module.c || \
            sed -i 's/"hdmi_out"};/"hdmi_out", "photoctl"};/' src/module.c
          grep -q '"auto_iso"' src/module.c || \
            sed -i 's/"photoctl"};/"photoctl", "auto_iso"};/' src/module.c

      - name: Integrate exposure separation into shoot task
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('EOS M patch: missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)

          replace_once(
              'src/shoot.c',
              '#include "powersave.h"\n',
              '#include "powersave.h"\n#include "expo_mode_sep.h"\n',
              'exposure separation header'
          )

          replace_once(
              'src/shoot.c',
              '#if defined(CONFIG_MODULES)\n        module_exec_cbr(CBR_SHOOT_TASK);\n#endif\n',
              '        expo_sep_update();\n'
              '        expo_sep_apply_deferred();\n\n'
              '#if defined(CONFIG_MODULES)\n'
              '        module_exec_cbr(CBR_SHOOT_TASK);\n'
              '#endif\n',
              'exposure separation shoot-task hook'
          )
          PY

      - name: Apply Photo+Movie touch separation and Auto ISO LiveView toggle
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('EOS M patch: missing ' + label)
              open(path, 'w').write(data.replace(old, new, 1))

          replace_once(
              'src/gui-common.c',
              'static int (*dual_iso_slim_step_recovery)(int) =\n'
              '    MODULE_FUNCTION(dual_iso_slim_step_recovery);\n',
              'static int (*dual_iso_slim_step_recovery)(int) =\n'
              '    MODULE_FUNCTION(dual_iso_slim_step_recovery);\n'
              'static int (*eosm_auto_iso_set_from_touch)(int) =\n'
              '    MODULE_FUNCTION(eosm_auto_iso_set_from_touch);\n'
              'static int (*eosm_auto_iso_is_enabled)(void) =\n'
              '    MODULE_FUNCTION(eosm_auto_iso_is_enabled);\n',
              'Auto ISO touch module hooks'
          )

          replace_once(
              'src/gui-common.c',
              '        if (!lvinfo_touch_editor_hit_test(x, y, &slot, &arrow))\n'
              '            lvinfo_touch_editor_close();\n'
              '        else if (arrow && slot >= 0)\n'
              '            slim_touch_lv_change_field(field, slot, arrow);\n',
              '        if (!lvinfo_touch_editor_hit_test(x, y, &slot, &arrow))\n'
              '            lvinfo_touch_editor_close();\n'
              '        else if (field == LVINFO_TOUCH_ISO && slot >= 0 && !arrow)\n'
              '        {\n'
              '            /* Center-tap on the ISO editor toggles Auto ISO; the\n'
              '             * arrows retain their normal manual ISO function. */\n'
              '            if (eosm_auto_iso_set_from_touch)\n'
              '            {\n'
              '                int enabled = eosm_auto_iso_is_enabled &&\n'
              '                              eosm_auto_iso_is_enabled();\n'
              '                eosm_auto_iso_set_from_touch(enabled ? -1 : 1);\n'
              '            }\n'
              '            lvinfo_touch_editor_close();\n'
              '        }\n'
              '        else if (arrow && slot >= 0)\n'
              '            slim_touch_lv_change_field(field, slot, arrow);\n',
              'Auto ISO center-tap toggle'
          )

          replace_once(
              'src/gui-common.c',
              'static int slim_touch_lv_context_ok(void)\n'
              '{\n'
              '    return lv && is_movie_mode() && !RECORDING &&\n'
              '           !gui_menu_shown() && lv_dispsize != 10 &&\n'
              '           !slim_crop_rec_transition_busy();\n'
              '}\n',
              'static int slim_touch_lv_context_ok(void)\n'
              '{\n'
              '    return lv && !RECORDING && !gui_menu_shown() &&\n'
              '           lv_dispsize != 10 && !slim_crop_rec_transition_busy();\n'
              '}\n',
              'shared Photo/Movie LV editor context'
          )
          PY

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-5_4-2016q3
          key: arm-toolchain-5_4-2016q3

      - name: Download ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget -q https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q3-update/+download/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-5_4-2016q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs
        run: |
          set -euo pipefail
          ls -lh platform/EOSM.202/*.bin platform/EOSM.202/*.zip
          zipfile=$(ls platform/EOSM.202/magiclantern-*.zip | head -n1)
          echo "Checking required Auto ISO and companion modules..."
          unzip -l "$zipfile" | grep -E 'ML/modules/(auto_iso|photoctl|crop_rec|dual_iso)\.mo'
          echo "Checking MLV playback/audio modules..."
          unzip -l "$zipfile" | grep -E 'ML/modules/mlv_(lite|play|snd)\.mo'
          echo "Checking Auto ISO package presence explicitly..."
          unzip -l "$zipfile" | grep -q 'ML/modules/auto_iso\.mo'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eosm-auto-iso-raw-meter-build
          path: |
            platform/EOSM.202/autoexec.bin
            platform/EOSM.202/*.zip
            platform/EOSM.202/*.sym
          if-no-files-found: error