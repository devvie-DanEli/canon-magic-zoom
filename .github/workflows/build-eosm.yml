name: Build EOS M
run-name: Build EOS M

on:
  push:
    branches:
      - main
      - feature/eosm-photo-touch-profiles
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Python 2 + Python 3 Docutils
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 python3-docutils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version
          python2 --version
          rst2html --version || true

      - name: Generate placeholder module info (avoids needing Python 2)
        run: |
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
              touch "${dir}module_strings.h"
            fi
          done

      - name: Enable Photo control module for autoload
        run: |
          set -euo pipefail
          grep -q '"photoctl"' src/module.c || \
            sed -i 's/"hdmi_out"};/"hdmi_out", "photoctl"};/' src/module.c
          grep 'core_modules' src/module.c

      - name: Fix EOS M Photo touch routing
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          def patch_file(path, replacements):
              data = open(path, 'r').read()
              for old, new, label in replacements:
                  if old not in data:
                      raise SystemExit('Photo touch patch: missing ' + label)
                  data = data.replace(old, new, 1)
              open(path, 'w').write(data)

          # Photo touch gets first refusal and then terminates the touch event.
          # This keeps the 2x2 Slim category grid as a menu-only surface.
          patch_file('src/gui-common.c', [
              (
                  '#ifdef CONFIG_SLIM_MENUS\n'
                  '    if (!menu_white_card_wb_handle_key(event->param, IS_FAKE(event))) return 0;\n',
                  '#ifdef CONFIG_EOSM\n'
                  '    if ((event->param == BGMT_TOUCH_1_FINGER ||\n'
                  '         event->param == BGMT_UNTOUCH_1_FINGER ||\n'
                  '         event->param == BGMT_TOUCH_2_FINGER ||\n'
                  '         event->param == BGMT_UNTOUCH_2_FINGER) &&\n'
                  '        !is_movie_mode())\n'
                  '    {\n'
                  '        handle_module_keys(event);\n'
                  '        return 0;\n'
                  '    }\n'
                  '#endif\n\n'
                  '#ifdef CONFIG_SLIM_MENUS\n'
                  '    if (!menu_white_card_wb_handle_key(event->param, IS_FAKE(event))) return 0;\n',
                  'photo module dispatch insertion'
              )
          ])

          # photoctl still consumes unassigned Photo touches internally as a
          # second line of defense if an event reaches the module directly.
          patch_file('modules/photoctl/photoctl.c', [
              (
                  '            if (!photoctl_touch_get_xy(event, &x, &y))\n'
                  '                return 1;\n',
                  '            if (!photoctl_touch_get_xy(event, &x, &y))\n'
                  '                return 0;\n',
                  'touch coordinate fallback'
              ),
              (
                  '                if (field != LVINFO_TOUCH_APERTURE &&\n'
                  '                    field != LVINFO_TOUCH_SHUTTER &&\n'
                  '                    field != LVINFO_TOUCH_ISO &&\n'
                  '                    field != LVINFO_TOUCH_WB)\n'
                  '                    return 1;\n',
                  '                if (field != LVINFO_TOUCH_APERTURE &&\n'
                  '                    field != LVINFO_TOUCH_SHUTTER &&\n'
                  '                    field != LVINFO_TOUCH_ISO &&\n'
                  '                    field != LVINFO_TOUCH_WB)\n'
                  '                    return 0;\n',
                  'Photo-only field consumption'
              ),
              (
                  '        case BGMT_UNTOUCH_1_FINGER:\n'
                  '            if (lvinfo_touch_editor_is_open())\n'
                  '                return 0;\n'
                  '            return 1;\n',
                  '        case BGMT_UNTOUCH_1_FINGER:\n'
                  '            if (lvinfo_touch_editor_is_open())\n'
                  '                return 0;\n'
                  '            return 0;\n',
                  'Photo touch release consumption'
              ),
              (
                  '        case BGMT_TOUCH_2_FINGER:\n'
                  '        case BGMT_UNTOUCH_2_FINGER:\n'
                  '            if (lvinfo_touch_editor_is_open())\n'
                  '                return 0;\n'
                  '            return 1;\n',
                  '        case BGMT_TOUCH_2_FINGER:\n'
                  '        case BGMT_UNTOUCH_2_FINGER:\n'
                  '            if (lvinfo_touch_editor_is_open())\n'
                  '                return 0;\n'
                  '            return 0;\n',
                  'Photo two-finger consumption'
              )
          ])
          print('EOS M Photo touch routing patched')
          PY

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-5_4-2016q3
          key: arm-toolchain-5_4-2016q3

      - name: Download ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget -q https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q3-update/+download/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-5_4-2016q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs
        run: |
          set -euo pipefail
          ls -lh platform/EOSM.202/autoexec.bin
          ls -lh platform/EOSM.202/magiclantern-*.zip
          zipfile=$(ls platform/EOSM.202/magiclantern-*.zip)
          for mod in crop_rec.mo dual_iso.mo hdmi_out.mo mlv_lite.mo mlv_play.mo mlv_snd.mo sd_uhs.mo file_man.mo bench.mo photoctl.mo; do
            if ! unzip -l "$zipfile" | grep -q "$mod"; then
              echo "Missing from zip: $mod"
              unzip -l "$zipfile" | grep '\\.mo$' || true
              exit 1
            fi
            echo "OK: $mod"
          done
          if unzip -l "$zipfile" | grep -E 'lua\\.mo|selftest\\.mo|arkanoid\\.mo'; then
            echo "Unexpected slim module in zip"
            exit 1
          fi

      - name: Upload autoexec.bin
        uses: actions/upload-artifact@v4
        with:
          name: autoexec.bin
          path: platform/EOSM.202/autoexec.bin
          if-no-files-found: error

      - name: Upload full Magic Lantern zip
        uses: actions/upload-artifact@v4
        with:
          name: magiclantern-eosm-zip
          path: platform/EOSM.202/magiclantern-*.zip
          if-no-files-found: error
