name: Build EOS M Video Memory Recall
run-name: Build EOS M Video Memory Recall

on:
  push:
    branches:
      - feature/eosm-auto-iso-raw-meter
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Generate placeholder module info
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
            fi
          done

      - name: Validate Auto ISO is disabled
        run: |
          set -euo pipefail
          echo "Checking that Auto ISO is not part of the EOS M module set..."
          if grep -Eq '(^|[[:space:]\\])auto_iso([[:space:]\\]|$)' modules/Makefile.modules.user; then
            echo "ERROR: auto_iso is still enabled in Makefile.modules.user"
            exit 1
          fi
          if grep -q '"auto_iso"' src/module.c; then
            echo "ERROR: auto_iso is still injected into src/module.c"
            exit 1
          fi
          if grep -q 'eosm_auto_iso_lv.o' src/Makefile.src; then
            echo "ERROR: Auto ISO LiveView core object is still enabled"
            exit 1
          fi

      - name: Validate Memory Recall shutter fix
        run: |
          set -euo pipefail
          grep -q 'mem_recall.o' src/Makefile.src
          grep -q 'crop_rec_memory_capture' modules/crop_rec/crop_rec.c
          grep -q 'crop_rec_memory_apply' modules/crop_rec/crop_rec.c
          grep -q 'hdr_set_rawshutter' src/mem_recall.c
          grep -q 'mem.m0.shutter' src/mem_recall.c

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-5_4-2016q3
          key: arm-toolchain-5_4-2016q3

      - name: Download ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget -q https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q3-update/+download/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-5_4-2016q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs
        run: |
          set -euo pipefail
          ls -lh platform/EOSM.202/*.bin platform/EOSM.202/*.zip
          zipfile=$(ls platform/EOSM.202/magiclantern-*.zip | head -n1)
          echo "Checking required video modules..."
          unzip -l "$zipfile" | grep -E 'ML/modules/(crop_rec|dual_iso|mlv_lite|mlv_play|mlv_snd|photoctl)\.mo'
          echo "Checking that Auto ISO is absent..."
          if unzip -l "$zipfile" | grep -q 'ML/modules/auto_iso\.mo'; then
            echo "ERROR: auto_iso.mo is still packaged"
            exit 1
          fi
          echo "Auto ISO is disabled and not packaged."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eosm-video-memory-recall-build
          path: |
            platform/EOSM.202/autoexec.bin
            platform/EOSM.202/*.zip
            platform/EOSM.202/*.sym
          if-no-files-found: error
