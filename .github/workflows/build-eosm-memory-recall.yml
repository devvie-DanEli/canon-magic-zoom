name: Build EOS M - Memory Recall Fixed
run-name: Build EOS M - Memory Recall Fixed

on:
  push:
    branches:
      - feature/eosm-memory-recall-fix
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Use the exact source base that produced the known-good Actions run
      # 33932005440. That build was tested for Memory Recall shutter saving.
      - name: Check out proven photo-touch-profiles base
        uses: actions/checkout@v4
        with:
          ref: feature/eosm-photo-touch-profiles

      - name: Overlay proven EOS M Auto ISO branch sources
        run: |
          set -euo pipefail
          git fetch origin feature/eosm-auto-iso

          # photoctl contains independent last-used Photo/Video exposure profiles.
          git show origin/feature/eosm-auto-iso:modules/photoctl/photoctl.c > /tmp/photoctl.c
          test -s /tmp/photoctl.c
          mkdir -p modules/photoctl
          cp /tmp/photoctl.c modules/photoctl/photoctl.c

          # expo_mode_sep is the core Photo/Movie exposure-separation implementation.
          git show origin/feature/eosm-auto-iso:src/expo_mode_sep.c > src/expo_mode_sep.c
          git show origin/feature/eosm-auto-iso:src/expo_mode_sep.h > src/expo_mode_sep.h
          test -s src/expo_mode_sep.c
          test -s src/expo_mode_sep.h

          echo 'Using proven Photo/Movie exposure separation sources'

      - name: Install Python 2 + Python 3 Docutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python2 python3-docutils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version
          python2 --version

      - name: Generate placeholder module info
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
            fi
          done

      - name: Enable proven Photo control module and exposure separation
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('EOS M patch: missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)
              print('OK:', label)

          replace_once(
              'src/module.c',
              'char *core_modules[] = {"mlv_lite", "crop_rec", "mlv_play", "mlv_snd", "sd_uhs", "lua", "file_man", "dual_iso", "silent", "bench", "hdmi_out"};',
              'char *core_modules[] = {"mlv_lite", "crop_rec", "mlv_play", "mlv_snd", "sd_uhs", "lua", "file_man", "dual_iso", "silent", "bench", "hdmi_out", "photoctl"};',
              'photoctl core-module autoload'
          )

          replace_once(
              'src/shoot.c',
              '#include "powersave.h"\n',
              '#include "powersave.h"\n#include "expo_mode_sep.h"\n',
              'exposure separation header'
          )

          replace_once(
              'src/shoot.c',
              '#if defined(CONFIG_MODULES)\n        module_exec_cbr(CBR_SHOOT_TASK);\n#endif\n',
              '        expo_sep_update();\n'
              '        expo_sep_apply_deferred();\n\n'
              '#if defined(CONFIG_MODULES)\n'
              '        module_exec_cbr(CBR_SHOOT_TASK);\n'
              '#endif\n',
              'exposure separation shoot-task hook'
          )

          replace_once(
              'src/Makefile.src',
              '\tpowersave.o \\\n',
              '\tpowersave.o \\\n\texpo_mode_sep.o \\\n',
              'exposure separation object'
          )

          print('Proven Photo/Video exposure separation integrated')
          PY

      - name: Apply proven Photo Live View touch routing
        run: |
          set -euo pipefail
          python2 - <<'PY'
          from __future__ import print_function

          def replace_once(path, old, new, label):
              data = open(path, 'r').read()
              if old not in data:
                  raise SystemExit('EOS M patch: missing ' + label)
              data = data.replace(old, new, 1)
              open(path, 'w').write(data)
              print('OK:', label)

          replace_once(
              'src/gui-common.c',
              'static int slim_touch_lv_context_ok(void)\n'
              '{\n'
              '    return lv && is_movie_mode() && !RECORDING &&\n'
              '           !gui_menu_shown() && lv_dispsize != 10 &&\n'
              '           !slim_crop_rec_transition_busy();\n'
              '}\n',
              'static int slim_touch_lv_context_ok(void)\n'
              '{\n'
              '    return lv && !RECORDING && !gui_menu_shown() &&\n'
              '           lv_dispsize != 10 && !slim_crop_rec_transition_busy();\n'
              '}\n',
              'shared Photo/Movie LV editor context'
          )

          replace_once(
              'src/gui-common.c',
              '    if (monitoring_graph_touch_toggle(x, y))\n'
              '        return 1;\n\n'
              '    if (mem_recall_panel_is_open())\n'
              '        return mem_recall_panel_touch(x, y);\n',
              '    if (is_movie_mode() && monitoring_graph_touch_toggle(x, y))\n'
              '        return 1;\n\n'
              '    if (is_movie_mode() && mem_recall_panel_is_open())\n'
              '        return mem_recall_panel_touch(x, y);\n',
              'Movie-only auxiliary touch controls'
          )

          replace_once(
              'src/gui-common.c',
              '            slim_touch_lv_control_consumed = slim_touch_lv_direct_editor(event);\n'
              '            if (slim_touch_lv_control_consumed)\n'
              '                return 0;\n'
              '            /* Tap gestures (including Quick Panel) only originate from the\n',
              '            slim_touch_lv_control_consumed = slim_touch_lv_direct_editor(event);\n'
              '            if (slim_touch_lv_control_consumed)\n'
              '                return 0;\n'
              '            if (!is_movie_mode())\n'
              '            {\n'
              '                slim_touch_lv_control_consumed = 1;\n'
              '                slim_touch_lv_pressed = 0;\n'
              '                slim_touch_tap_count = 0;\n'
              '                slim_touch_tap_deadline = 0;\n'
              '                return 0;\n'
              '            }\n'
              '            /* Tap gestures (including Quick Panel) only originate from the\n',
              'Photo-mode no-fallthrough gate'
          )

          replace_once(
              'src/gui-common.c',
              '        if (slim_touch_lv_context_ok())\n'
              '        {\n'
              '            /* Keep the existing simultaneous two-finger Last Settings shortcut. */\n'
              '            gui_open_last_menu_selection();\n'
              '            return 0;\n'
              '        }\n',
              '        if (slim_touch_lv_context_ok() && is_movie_mode())\n'
              '        {\n'
              '            /* Keep the existing simultaneous two-finger Last Settings shortcut. */\n'
              '            gui_open_last_menu_selection();\n'
              '            return 0;\n'
              '        }\n',
              'Movie-only two-finger Last Settings'
          )

          replace_once(
              'src/gui-common.c',
              'static void slim_touch_open_for_taps(int taps)\n'
              '{\n'
              '    if (!slim_touch_lv_context_ok() || lvinfo_touch_editor_is_open())\n'
              '        return;\n',
              'static void slim_touch_open_for_taps(int taps)\n'
              '{\n'
              '    if (!slim_touch_lv_context_ok() || !is_movie_mode() ||\n'
              '        lvinfo_touch_editor_is_open())\n'
              '        return;\n',
              'Movie-only tap/menu open'
          )

          print('Proven Photo Live View touch routing integrated')
          PY

      - name: Validate proven architecture before compilation
        run: |
          set -euo pipefail
          grep -q '"photoctl"' src/module.c
          grep -q 'photoctl.last_photo.shutter' modules/photoctl/photoctl.c
          grep -q 'photoctl.last_video.shutter' modules/photoctl/photoctl.c
          grep -q 'expo_sep_update' src/shoot.c
          grep -q 'expo_sep_apply_deferred' src/shoot.c
          grep -q 'CONFIG_INT("expo.sep.mv.shutter"' src/expo_mode_sep.c
          grep -q 'CONFIG_INT("expo.sep.ph.shutter"' src/expo_mode_sep.c
          grep -q 'return lv && !RECORDING && !gui_menu_shown()' src/gui-common.c
          grep -q 'return is_movie_mode() && !RECORDING;' src/mem_recall.c
          grep -q 'if (\*f.shutter)' src/mem_recall.c
          echo 'Proven build base validated: Photo touch + separate Photo/Movie exposure memory + direct Memory Recall shutter restore.'

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-5_4-2016q3
          key: arm-toolchain-5_4-2016q3

      - name: Download ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd ~
          wget -q https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q3-update/+download/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-5_4-2016q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -f platform/EOSM.202/autoexec.bin
          zipfile=$(ls platform/EOSM.202/magiclantern-*.zip)
          for mod in crop_rec.mo dual_iso.mo hdmi_out.mo mlv_lite.mo mlv_play.mo mlv_snd.mo sd_uhs.mo file_man.mo bench.mo photoctl.mo; do
            unzip -l "$zipfile" | grep -q "$mod"
            echo "OK: $mod"
          done
          if unzip -l "$zipfile" | grep -E 'auto_iso\.mo'; then
            echo 'Unexpected Auto ISO module in zip'
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eosm-memory-recall-fixed
          path: |
            platform/EOSM.202/autoexec.bin
            platform/EOSM.202/magiclantern-*.zip
          if-no-files-found: error