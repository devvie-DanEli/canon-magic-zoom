name: Build EOS M - Memory Recall Fixed
run-name: Build EOS M - Memory Recall Fixed

on:
  push:
    branches:
      - feature/eosm-memory-recall-fix
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Memory Recall branch
        uses: actions/checkout@v4

      - name: Install Python 2 + Python 3 Docutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python2 python3-docutils
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version
          python2 --version

      - name: Generate placeholder module info
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            if [ -f "${dir}Makefile" ]; then
              printf '#define MODULE_STRINGS() \\\n    MODULE_STRINGS_START() \\\n    MODULE_STRINGS_END()\n' > "${dir}module_strings.h"
            fi
          done

      - name: Restore proven Photo/Video profile autoload
        run: |
          set -euo pipefail
          python2 - <<'PY'
          path = 'src/module.c'
          data = open(path, 'r').read()
          old = 'char *core_modules[] = {"mlv_lite", "crop_rec", "mlv_play", "mlv_snd", "sd_uhs", "lua", "file_man", "dual_iso", "silent", "bench", "hdmi_out"};'
          new = 'char *core_modules[] = {"mlv_lite", "crop_rec", "mlv_play", "mlv_snd", "sd_uhs", "lua", "file_man", "dual_iso", "silent", "bench", "hdmi_out", "photoctl"};'
          if old in data:
              data = data.replace(old, new, 1)
          elif 'char *core_modules[]' not in data or '"photoctl"' not in data:
              raise SystemExit('Unable to restore photoctl core-module autoload')
          open(path, 'w').write(data)
          print('photoctl autoload restored')
          PY

      - name: Fix Memory Recall shutter restore ordering
        run: |
          set -euo pipefail
          python2 - <<'PY'
          path = 'src/mem_recall.c'
          data = open(path, 'r').read()

          def replace_once(old, new, label):
              global data
              if old not in data:
                  raise SystemExit('Memory Recall patch: missing ' + label)
              data = data.replace(old, new, 1)

          replace_once(
              'static int (*crop_rec_memory_apply)(int, int, int, int, int) =\n'
              '    MODULE_FUNCTION(crop_rec_memory_apply);\n\n'
              'static int mem_panel_open;\n',
              'static int (*crop_rec_memory_apply)(int, int, int, int, int) =\n'
              '    MODULE_FUNCTION(crop_rec_memory_apply);\n'
              'static int (*crop_rec_lv_transition_busy)() =\n'
              '    MODULE_FUNCTION(crop_rec_lv_transition_busy);\n\n'
              'static int mem_pending_shutter;\n'
              'static int mem_pending_shutter_attempts;\n\n'
              'static int mem_panel_open;\n',
              'Memory Recall state declarations'
          )

          replace_once(
              'int mem_recall_load(int slot)\n{\n',
              'static void mem_recall_apply_pending_shutter(int timer, void *opaque)\n{\n'
              '    (void)timer;\n'
              '    (void)opaque;\n\n'
              '    if (!mem_pending_shutter)\n'
              '        return;\n\n'
              '    /* Memory Recall is strictly for idle Movie Live View. */\n'
              '    if (!is_movie_mode() || RECORDING || !lv)\n'
              '    {\n'
              '        mem_pending_shutter = 0;\n'
              '        mem_pending_shutter_attempts = 0;\n'
              '        return;\n'
              '    }\n\n'
              '    /* Crop Mood changes the Canon LV pipeline asynchronously.\n'
              '     * Wait until that transition is finished before touching Tv. */\n'
              '    if (crop_rec_lv_transition_busy && crop_rec_lv_transition_busy())\n'
              '    {\n'
              '        if (mem_pending_shutter_attempts++ < 20)\n'
              '            delayed_call(100, mem_recall_apply_pending_shutter, 0);\n'
              '        else\n'
              '        {\n'
              '            mem_pending_shutter = 0;\n'
              '            mem_pending_shutter_attempts = 0;\n'
              '        }\n'
              '        return;\n'
              '    }\n\n'
              '    /* Use the retrying shutter path now that Crop Mood is settled. */\n'
              '    hdr_set_rawshutter(mem_pending_shutter);\n'
              '    if (lens_info.raw_shutter == mem_pending_shutter)\n'
              '    {\n'
              '        mem_pending_shutter = 0;\n'
              '        mem_pending_shutter_attempts = 0;\n'
              '        lens_display_set_dirty();\n'
              '        return;\n'
              '    }\n\n'
              '    if (mem_pending_shutter_attempts++ < 20)\n'
              '        delayed_call(100, mem_recall_apply_pending_shutter, 0);\n'
              '    else\n'
              '    {\n'
              '        mem_pending_shutter = 0;\n'
              '        mem_pending_shutter_attempts = 0;\n'
              '        lens_display_set_dirty();\n'
              '    }\n'
              '}\n\n'
              'int mem_recall_load(int slot)\n{\n',
              'Memory Recall shutter restore task'
          )

          replace_once(
              '    if (*f.iso)\n'
              '        lens_set_rawiso(*f.iso);\n'
              '    if (*f.shutter)\n'
              '        lens_set_rawshutter(*f.shutter);\n'
              '    if (*f.aperture && lens_info.lens_exists)\n',
              '    if (*f.iso)\n'
              '        lens_set_rawiso(*f.iso);\n'
              '    mem_pending_shutter = *f.shutter;\n'
              '    mem_pending_shutter_attempts = 0;\n'
              '    if (mem_pending_shutter)\n'
              '        delayed_call(200, mem_recall_apply_pending_shutter, 0);\n'
              '    if (*f.aperture && lens_info.lens_exists)\n',
              'deferred shutter assignment'
          )

          open(path, 'w').write(data)
          print('Memory Recall shutter ordering fix applied')
          PY

      - name: Validate fixed architecture
        run: |
          set -euo pipefail
          grep -q '"photoctl"' src/module.c
          grep -q 'photoctl.last_photo.shutter' modules/photoctl/photoctl.c
          grep -q 'photoctl.last_video.shutter' modules/photoctl/photoctl.c
          grep -q 'return is_movie_mode() && !RECORDING;' src/mem_recall.c
          grep -q 'crop_rec_lv_transition_busy' src/mem_recall.c
          grep -q 'hdr_set_rawshutter(mem_pending_shutter)' src/mem_recall.c
          grep -q 'lens_info.raw_shutter == mem_pending_shutter' src/mem_recall.c
          if grep -Eq '(^|[[:space:]])auto_iso([[:space:]]|$)' modules/Makefile.modules.user; then
            echo 'Auto ISO must remain disabled'
            exit 1
          fi
          echo 'Photo/Video separation and movie-only Memory Recall shutter restore validated.'

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-5_4-2016q3
          key: arm-toolchain-5_4-2016q3

      - name: Download ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd ~
          wget -q https://launchpad.net/gcc-arm-embedded/5.0/5-2016-q3-update/+download/gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-5_4-2016q3-20160926-linux.tar.bz2

      - name: Add toolchain to PATH
        run: echo "$HOME/gcc-arm-none-eabi-5_4-2016q3/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: arm-none-eabi-gcc --version

      - name: Build EOS M platform + modules + package zip
        run: make -C platform/EOSM.202 zip SHELL=/bin/bash

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -f platform/EOSM.202/autoexec.bin
          zipfile=$(ls platform/EOSM.202/magiclantern-*.zip)
          for mod in crop_rec.mo dual_iso.mo hdmi_out.mo mlv_lite.mo mlv_play.mo mlv_snd.mo sd_uhs.mo file_man.mo bench.mo photoctl.mo; do
            unzip -l "$zipfile" | grep -q "$mod"
            echo "OK: $mod"
          done
          if unzip -l "$zipfile" | grep -E 'auto_iso\.mo'; then
            echo 'Unexpected Auto ISO module in zip'
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eosm-memory-recall-fixed
          path: |
            platform/EOSM.202/autoexec.bin
            platform/EOSM.202/magiclantern-*.zip
          if-no-files-found: error
